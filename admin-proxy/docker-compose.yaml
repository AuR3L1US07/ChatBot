# HTTPS proxy for the WeChat bot admin page at https://<server-ip>:8443.
# Uses its own port, so it never touches another web server on 80/443.
services:
  admin-proxy:
    image: caddy:2
    container_name: wxbot_admin_proxy
    restart: unless-stopped
    ports:
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [wxbot]

networks:
  wxbot:
    name: wxbot
    external: true
